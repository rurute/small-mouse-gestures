<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>small mouse gestures 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <div class="titles">
          <h1>small mouse gestures</h1>
          <p>設定</p>
        </div>
        <div class="header-actions">
          <span id="status" role="status"></span>
          <button id="reset" class="button button-ghost" type="button">既定に戻す</button>
          <button id="save" class="button button-primary" type="button">保存</button>
        </div>
      </header>

      <section class="card">
        <h2 class="card-title">ストロークジェスチャ</h2>
        <div id="stroke-list" class="tile-grid"></div>

        <div id="record-area" class="record">
          <p class="record-hint">この枠の中で右ボタンをドラッグすると、新しいジェスチャを記録できます</p>
          <p id="record-result" class="record-result"></p>
          <button id="add-recorded" class="button button-primary" type="button" disabled>
            記録したジェスチャを追加
          </button>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">ロッカージェスチャ</h2>
        <div id="rocker-list" class="row-list"></div>
      </section>

      <section class="card">
        <h2 class="card-title">表示</h2>
        <div class="field-row">
          <div class="checks">
            <label class="check"><input id="trail" type="checkbox" /><span>軌跡を表示する</span></label>
            <label class="check"><input id="label" type="checkbox" /><span>アクション名を表示する</span></label>
          </div>
          <label class="field">
            <span class="field-label">軌跡の色</span>
            <input id="color" type="color" />
          </label>
          <label class="field">
            <span class="field-label">軌跡の太さ</span>
            <input id="width" type="number" min="1" max="20" />
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
